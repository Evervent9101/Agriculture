# Local development / quick test on any machine:  docker compose up --build
# Then open http://localhost:5173
# (Production uses PM2 + a PostgreSQL container on the deployment server - see README.)
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=farm
      - POSTGRES_PASSWORD=farm
      - POSTGRES_DB=farmdb
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farmdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      - APP_VERSION=dev
      - DATABASE_URL=postgres://farm:farm@db:5432/farmdb
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [backend]
    environment:
      - VITE_API_TARGET=http://backend:3000

volumes:
  dev_pgdata:
